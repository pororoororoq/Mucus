name: Broadcast Scrape Probe

on:
  push:
    branches: [claude/korean-news-digest-naver-y7p4ch]
    paths: ["news_digest/scrape_probe.py", ".github/workflows/probe.yml"]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r news_digest/requirements.txt
      - run: python -m news_digest.scrape_probe
