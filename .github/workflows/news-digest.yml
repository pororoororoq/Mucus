name: Korean News Digest

on:
  # TEMPORARY: lets us do a real test run on this feature branch before it is
  # merged to main. Remove this push trigger after verifying the run.
  push:
    branches: [claude/korean-news-digest-naver-y7p4ch]
    paths: [".github/workflows/news-digest.yml", "news_digest/**"]
  schedule:
    # 22:00 UTC = 07:00 KST, every day.
    # NOTE: GitHub only runs scheduled workflows from the DEFAULT branch,
    # so this cron fires once this file is merged into main.
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      recency:
        description: "Recency window (e.g. 1d, 2d, 12h)"
        required: false
        default: "1d"
      enrich:
        description: "Fetch article summaries (1) or headlines only (0)"
        required: false
        default: "1"

permissions:
  contents: write

concurrency:
  group: news-digest
  cancel-in-progress: false

jobs:
  build-digest:
    runs-on: ubuntu-latest
    env:
      # Email delivery is optional. Add these two repo secrets to enable it:
      #   MAIL_USERNAME = the Gmail address that sends (e.g. you@gmail.com)
      #   MAIL_PASSWORD = a Gmail App Password (16 chars, requires 2FA)
      # Without them, the email step is skipped and the digest is still
      # committed + uploaded as an artifact.
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      DIGEST_TO: jakekim070917@gmail.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r news_digest/requirements.txt

      - name: Build digest
        env:
          RECENCY: ${{ github.event.inputs.recency || '1d' }}
          ENRICH: ${{ github.event.inputs.enrich || '1' }}
          # Optional Naver Search API cross-check (safe to leave unset).
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python -m news_digest.main

      - name: Prepare email body
        id: body
        run: |
          {
            echo 'content<<DIGEST_EOF'
            cat digests/latest.md
            echo DIGEST_EOF
          } >> "$GITHUB_OUTPUT"
          echo "date=$(TZ=Asia/Seoul date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Send email
        if: ${{ env.MAIL_USERNAME != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ env.MAIL_USERNAME }}
          password: ${{ env.MAIL_PASSWORD }}
          from: Korean News Digest <${{ env.MAIL_USERNAME }}>
          to: ${{ env.DIGEST_TO }}
          subject: "📰 오늘의 한국 뉴스 다이제스트 — ${{ steps.body.outputs.date }}"
          body: ${{ steps.body.outputs.content }}
          attachments: digests/latest.md

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: news-digest
          path: digests/*.md
          if-no-files-found: warn

      - name: Commit digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests/
          if git diff --staged --quiet; then
            echo "No digest changes to commit."
          else
            git commit -m "chore: add news digest for $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git push
          fi
